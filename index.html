<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="GOLDNOVA">
<title>GOLDNOVA United</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="authView" class="auth hide"></div>
<div id="appView" class="hide">
<header class="bar"><div class="bar-in">
  <div class="brand"><span class="crest"></span><div><b>GOLDNOVA UNITED</b><small>Halısaha takımı, est. 2024</small></div></div>
  <div class="row" style="flex-wrap:nowrap"><button class="ib" id="meBtn" aria-label="Profilim"></button><button class="ib" id="themeBtn" aria-label="Açık ya da koyu tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 000 16z" fill="currentColor"/></svg></button></div>
</div></header>
<main>
  <section class="view" id="v-home"><div class="grid"><div class="col" id="homeL"></div><div class="col" id="homeR"></div></div></section>
  <section class="view" id="v-matches">
    <div class="vh"><div><h1 class="ttl">Maçlar</h1><p class="sub" id="mSub"></p></div><button class="btn pri hide" id="newMatch">+ Yeni maç</button></div>
    <div class="grid"><div class="col" id="mL"></div><div class="col" id="mR"></div></div>
  </section>
  <section class="view" id="v-lineup">
    <div class="vh"><div><h1 class="ttl">Diziliş</h1><p class="sub" id="luSub"></p></div><select id="luSel" aria-label="Maç seç" style="width:auto;max-width:100%"></select></div>
    <div class="lw" id="luBody"></div>
  </section>
  <section class="view" id="v-feed">
    <div class="vh" style="max-width:600px;margin-left:auto;margin-right:auto"><div><h1 class="ttl">Akış</h1><p class="sub">Goller, kurtarışlar, en iyi anlar</p></div><button class="btn pri" id="upBtn">+ Video yükle</button></div>
    <div style="max-width:600px;margin:0 auto 12px"><div class="chips" id="feedF"></div></div>
    <div class="feed" id="feed"></div>
  </section>
  <section class="view" id="v-squad">
    <div class="vh"><div><h1 class="ttl">Kadro</h1><p class="sub" id="sqSub"></p></div><div class="seg" id="sqView"><button data-v="c" aria-pressed="true">Kartlar</button><button data-v="l" aria-pressed="false">Liste</button></div></div>
    <div class="chips" id="posF" style="margin-bottom:12px"></div>
    <div id="squad"></div>
    <div class="card" style="margin-top:14px"><div class="sh"><h2 class="st">Liderler</h2></div><div class="seg" id="lbS" style="margin-bottom:8px"></div><div class="lb" id="lb"></div></div>
  </section>
  <section class="view" id="v-me"><div class="grid"><div class="col" id="meL"></div><div class="col" id="meR"></div></div></section>
</main>
<nav class="tabs" aria-label="Bölümler"><div class="in">
  <a href="#home" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg>Ana sayfa</a>
  <a href="#matches" data-v="matches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Maçlar</a>
  <a href="#lineup" data-v="lineup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M4 12h16"/><circle cx="12" cy="12" r="3"/></svg>Diziliş</a>
  <a href="#feed" data-v="feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="5" width="14" height="14" rx="3"/><path d="M17 10l4-2.5v9L17 14"/></svg>Akış</a>
  <a href="#squad" data-v="squad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M8 3l-5 3 2 4 2-1v12h10V9l2 1 2-4-5-3a4 4 0 01-8 0z"/></svg>Kadro</a>

</div></nav>
</div>
<dialog id="dlg"><div class="dl" id="dlb"></div></dialog>
<input type="file" id="photoIn" accept="image/*" hidden>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
